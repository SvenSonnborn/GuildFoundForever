# Pushing a tag builds the ZIP and uploads it once the tests pass.
#   0.7.0-beta  -> beta file     1.0.0 -> release file     (a tag containing "alpha" -> alpha file)
# The version in the TOC (@project-version@) becomes the tag. The packager maps interface 16001 to
# the Forever game version on CurseForge. The ZIP also goes to the GitHub release of the tag.
#
# Repository secret (Settings > Secrets and variables > Actions):
#   CF_API_KEY      CurseForge API token (the project ID is ## X-Curse-Project-ID in the TOC)
# Without it the CurseForge upload is skipped and only the GitHub release is made.
# Do not set ## X-WoWI-ID: WoWInterface has no Forever version and the upload would fail.
name: Release

on:
  push:
    tags:
      - "*"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        shell: powershell
        run: .\tests\run.ps1

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
